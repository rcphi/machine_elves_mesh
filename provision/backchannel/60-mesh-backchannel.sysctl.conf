# /etc/sysctl.d/60-mesh-backchannel.conf - installed by install-diamond.sh.
#
# Replies to the LTE back channel are checked against the main table, which
# has no route home when the friend's network is down - exactly when the back
# channel is needed - so reverse-path filtering would drop them. The effective
# setting is max(all, interface) and Ubuntu sets all=2 in
# 10-network-security.conf, which this file sorts after. With all=0, every
# interface keeps its own value: eno1 stays at 2 (loose), and
# mesh-backchannel-link sets the LTE interface to 0 each time it runs.
net.ipv4.conf.all.rp_filter = 0
