# /etc/systemd/networkd.conf.d/60-mesh-backchannel.conf - installed by
# install-diamond.sh.
#
# By default systemd-networkd deletes routing rules and routes it did not
# create, whenever it starts or reconfigures - a package upgrade, a
# `netplan apply`. That would delete the back channel's fence, and for up to a
# minute the tunnel user would route by the main table and leave by eno1:
# management on the network being measured. networkd still manages
# everything it configures itself.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
