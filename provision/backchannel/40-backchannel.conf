# Installed by provision/backchannel/install-riverboat.sh.
# diamond's back channel: this user may hold localhost:2201 open and do
# nothing else. The key line in authorized_keys says the same; either alone
# holds.
Match User backchannel
    AllowTcpForwarding remote
    PermitListen localhost:2201
    PermitOpen none
    AllowStreamLocalForwarding no
    PermitTunnel no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    ForceCommand /usr/sbin/nologin
    # A new LTE address kills diamond's socket without a FIN. Without these
    # the dead session keeps 2201 for ~2 h (TCP keepalive) and every
    # reconnect fails its forward. ~90 s, a few hundred bytes a minute idle.
    ClientAliveInterval 30
    ClientAliveCountMax 3
