# /etc/systemd/system/mesh-node.service.d/lan-only.conf, on diamond.
#
# The mesh node may use the friend's ethernet and loopback, and nothing else.
# The back channel's tunnel is barred from eno1 the same way
# (RestrictNetworkInterfaces=~eno1); this is the other half, so the rule that
# the mesh never touches the management link is enforced by the kernel for the
# node itself, not only by routing.
#
# Added 2026-11-14, after the node was found sending mDNS out of the LTE
# interface: --no-mdns had left libp2p-mdns joined to the multicast group on
# every interface, and multicast with a source address leaves by that
# address's interface without consulting the routing tables the fence uses.
# The node no longer does that (de6ec47). This makes the next such surprise
# impossible rather than unlikely.
#
# The node still lists the LTE address among its own, because it listens on
# 0.0.0.0. Nothing can use it: the address is behind the carrier's NAT, and
# this filter drops anything that tried.
[Service]
RestrictNetworkInterfaces=lo eno1
