# Replaces /etc/netplan/00-installer-config.yaml on diamond.
#
# It must replace that file rather than sit beside it: netplan merges files
# and concatenates address lists, so a second file would keep the installer's
# static 192.168.50.48 alongside the lease. At home the router reserves .48
# for diamond, so this changes nothing there and makes the box work on any
# other network. See docs/superpowers/specs/2026-11-05-lte-backchannel-design.md.
network:
  version: 2
  ethernets:
    eno1:
      dhcp4: true
      dhcp6: true
      # Kept from the installer's config as backups, beside whatever the local
      # router offers. systemd-resolved moves to the next server when one stops
      # answering, so a friend's router with broken DNS does not cost the box
      # its clock: timesyncd finds its servers by name, and every measurement
      # is a timestamp. The mesh and the back channel dial by address and do
      # not need DNS at all.
      nameservers:
        addresses:
          - 208.67.222.222
          - 8.8.8.8
