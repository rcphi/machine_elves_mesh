[package]
name = "mesh-node"
version = "0.1.0"
edition = "2021"
description = "Phase 0 mesh node: forms an overlay, tracks membership, notices when a peer disappears."

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
libp2p = { version = "0.56.0", features = ["tokio", "quic", "tcp", "noise", "yamux", "gossipsub", "mdns", "identify", "ping", "macros", "relay", "dcutr", "autonat"] }
# AutoNAT v2 takes its randomness as a parameter; this is the generator it
# defaults to, named so its probe interval can be set.
rand_core = { version = "0.6", features = ["getrandom"] }
# UPnP, asked of the gateway directly before by multicast. libp2p's own upnp
# behaviour searches by multicast only, which a host kept away from its
# household (isolate-lan) may not send.
igd-next = { version = "0.16", default-features = false, features = ["aio_tokio"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
wasmtime = "48.0.0"

[dev-dependencies]
# `test-util` gives the tests a clock they can move: a fault that needs the mesh
# to stay healthy for two days cannot be reproduced by waiting for it.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "test-util"] }
